[project]
name = "api-automation-framework"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "pytest-html>=4.2.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
markers = [
    "smoke: critical happy-path checks across core endpoints",
    "regression: full CRUD and schema coverage",
    "negative: invalid input, missing auth, and error-handling scenarios",
]

addopts = "--html=reports/report.html --self-contained-html"